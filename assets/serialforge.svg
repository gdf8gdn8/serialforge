<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1D24"/>
      <stop offset="100%" stop-color="#0B0D11"/>
    </linearGradient>

    <!-- Forge Ember Gradient -->
    <linearGradient id="forgeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5500"/>
      <stop offset="50%" stop-color="#FF8800"/>
      <stop offset="100%" stop-color="#FFC800"/>
    </linearGradient>

    <!-- Serial Cyan Gradient -->
    <linearGradient id="serialCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0088FF"/>
    </linearGradient>

    <!-- Metallic Anvil Gradient -->
    <linearGradient id="anvilMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A5263"/>
      <stop offset="50%" stop-color="#2E3440"/>
      <stop offset="100%" stop-color="#1E222A"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle Frame -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" stroke="#2E3440" stroke-width="6"/>

  <!-- Glowing Forge Background Ring -->
  <circle cx="256" cy="240" r="150" fill="none" stroke="url(#forgeGlow)" stroke-width="4" opacity="0.25" filter="url(#glow)"/>

  <!-- Anvil Base (Forge) -->
  <path d="M 140 330 
           L 372 330 
           Q 380 330 380 340 
           L 360 370 
           Q 355 380 340 380 
           L 172 380 
           Q 157 380 152 370 
           L 132 340 
           Q 132 330 140 330 Z" 
        fill="url(#anvilMetal)" stroke="#5A657B" stroke-width="4"/>

  <!-- Anvil Body & Horn -->
  <path d="M 120 200 
           L 330 200 
           Q 390 200 420 230 
           Q 370 250 330 250 
           L 310 290 
           L 202 290 
           L 182 250 
           L 140 250 
           Q 120 250 120 230 Z" 
        fill="url(#anvilMetal)" stroke="#5A657B" stroke-width="4"/>

  <!-- DB9 Serial Plug Trapezoid Contour on Anvil Body -->
  <path d="M 170 215 L 342 215 L 326 245 L 186 245 Z" fill="#12151B" stroke="url(#serialCyan)" stroke-width="3"/>

  <!-- 9 Serial Pins (DB9 Layout) -->
  <g fill="url(#forgeGlow)">
    <!-- Top Row (5 Pins) -->
    <circle cx="196" cy="225" r="5"/>
    <circle cx="226" cy="225" r="5"/>
    <circle cx="256" cy="225" r="5"/>
    <circle cx="286" cy="225" r="5"/>
    <circle cx="316" cy="225" r="5"/>
    <!-- Bottom Row (4 Pins) -->
    <circle cx="211" cy="237" r="5"/>
    <circle cx="241" cy="237" r="5"/>
    <circle cx="271" cy="237" r="5"/>
    <circle cx="301" cy="237" r="5"/>
  </g>

  <!-- Digital RX/TX Serial Pulse Wave (Forged Waveform) -->
  <path d="M 80 200 
           L 150 200 
           L 150 140 
           L 210 140 
           L 210 200 
           L 270 200 
           L 270 110 
           L 340 110 
           L 340 200 
           L 430 200" 
        fill="none" stroke="url(#serialCyan)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Forge Sparks / Data Bits -->
  <circle cx="280" cy="90" r="6" fill="url(#forgeGlow)"/>
  <circle cx="355" cy="80" r="4" fill="url(#forgeGlow)"/>
  <circle cx="135" cy="120" r="5" fill="url(#forgeGlow)"/>
  <circle cx="225" cy="125" r="4" fill="url(#forgeGlow)"/>
</svg>
